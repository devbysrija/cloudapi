
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Firebase Google Authentication</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #eaf0ff;
            text-align: center;
            padding: 60px 15px;
        }

        .container {
            background: white;
            max-width: 450px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        button {
            background: #4285f4;
            color: white;
            border: none;
            padding: 12px 18px;
            margin: 8px 4px;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #2865c7;
        }

        #logout {
            background: #d93025;
        }

        #userDetails {
            margin-top: 20px;
            overflow-wrap: anywhere;
            text-align: left;
        }

        #message {
            margin-top: 18px;
            overflow-wrap: anywhere;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div class="container">
        <h2>Google Authentication</h2>
        <p>Sign in with Google and save your details to Firestore.</p>

        <button id="login">Sign in with Google</button>
        <button id="logout" class="hidden">Logout</button>

        <div id="userDetails" class="hidden">
            <h3>User Details</h3>
            <p><strong>Name:</strong> <span id="name"></span></p>
            <p><strong>Email:</strong> <span id="email"></span></p>
            <p><strong>User ID:</strong> <span id="uid"></span></p>
            <p><strong>Firestore:</strong> <span id="status"></span></p>
        </div>

        <p id="message">Please sign in to continue.</p>
    </div>

    <script type="module">
        import { initializeApp }
            from "https://www.gstatic.com/firebasejs/13.0.0/firebase-app.js";

        import {
            getAuth,
            GoogleAuthProvider,
            signInWithPopup,
            signOut,
            onAuthStateChanged
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-auth.js";

        import {
            getFirestore,
            doc,
            setDoc,
            getDoc,
            serverTimestamp
        } from "https://www.gstatic.com/firebasejs/13.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "neww-1ddbb.firebaseapp.com",
            projectId: "neww-1ddbb",
            storageBucket: "YOUR_STORAGE_BUCKET",
            appId: "YOUR_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const loginButton = document.getElementById("login");
        const logoutButton = document.getElementById("logout");
        const message = document.getElementById("message");
        const userDetails = document.getElementById("userDetails");

        loginButton.addEventListener("click", async () => {
            loginButton.disabled = true;
            message.textContent = "Opening Google sign-in...";

            try {
                await signInWithPopup(auth, provider);
                // onAuthStateChanged below saves the user.
            } catch (error) {
                console.error("Login error:", error);
                message.textContent =
                    "Login failed: " + error.message;
            } finally {
                loginButton.disabled = false;
            }
        });

        async function saveUser(user) {
            const userRef = doc(db, "users", user.uid);

            await setDoc(userRef, {
                uid: user.uid,
                name: user.displayName || "",
                email: user.email || "",
                photoURL: user.photoURL || "",
                updatedAt: serverTimestamp()
            }, { merge: true });

        
            const snapshot = await getDoc(userRef);

            if (!snapshot.exists()) {
                throw new Error("User document was not found after saving.");
            }

            document.getElementById("name").textContent =
                snapshot.data().name || "";
            document.getElementById("email").textContent =
                snapshot.data().email || "";
            document.getElementById("uid").textContent = user.uid;
            document.getElementById("status").textContent =
                "Saved successfully!";
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                loginButton.classList.add("hidden");
                logoutButton.classList.remove("hidden");
                userDetails.classList.remove("hidden");
                message.textContent =
                    "Logged in successfully. Saving your details...";

                try {
                    await saveUser(user);
                    message.textContent =
                        "Logged in successfully! User saved to Firestore.";
                } catch (error) {
                    console.error("Firestore error:", error);
                    document.getElementById("status").textContent =
                        "Save failed";
                    message.textContent =
                        "Firestore error: " + error.code +
                        " - " + error.message;
                }
            } else {
                loginButton.classList.remove("hidden");
                logoutButton.classList.add("hidden");
                userDetails.classList.add("hidden");
                message.textContent = "Please sign in to continue.";
            }
        });

        logoutButton.addEventListener("click", async () => {
            try {
                await signOut(auth);
                message.textContent = "Logged out successfully.";
            } catch (error) {
                console.error("Logout error:", error);
                message.textContent =
                    "Logout failed: " + error.message;
            }
        });
    </script>
</body>
</html>
